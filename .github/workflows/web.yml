name: Verify & deploy web

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, lint, unit + database tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test -- --ci
      - run: npm run test:scripts
      # Rebuilds the database from migrations + seed and runs every pgTAP suite (PGlite, no Docker).
      - run: npm run db:verify

  deploy:
    name: Build & deploy to GitHub Pages
    needs: verify
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Exports with .env.production (public values only), checks the bundle for
      # secrets / wrong backend, and adds .nojekyll + 404.html.
      - run: npm run build:web:pages
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist
          # v4+ drops dotfiles by default; keep dist/.nojekyll so the artifact matches the build.
          include-hidden-files: true
      - id: deployment
        uses: actions/deploy-pages@v5
